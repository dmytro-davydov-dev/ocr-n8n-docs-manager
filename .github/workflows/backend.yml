name: backend

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "apps/backend/**"
      - "packages/api-client/openapi.json"
      - ".github/workflows/backend.yml"

jobs:
  test-and-verify-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: contracts
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: apps/backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: apps/backend
        run: python -m unittest discover -v -s tests

      - name: Verify OpenAPI contract has no drift
        working-directory: apps/backend
        run: python scripts/check_openapi_drift.py

      - name: Apply Alembic migrations against a clean database
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/contracts
        run: alembic upgrade head

      - name: Verify models have no un-migrated schema drift
        working-directory: apps/backend
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/contracts
        run: alembic check
