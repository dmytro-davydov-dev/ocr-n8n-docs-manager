services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
      VITE_ENABLE_API_MOCKS: ${VITE_ENABLE_API_MOCKS:-false}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contracts}}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DOCUMENTS_STORAGE_PATH: ${DOCUMENTS_STORAGE_PATH:-/documents}
      MAX_UPLOAD_SIZE_BYTES: ${MAX_UPLOAD_SIZE_BYTES:-52428800}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://n8n:5678/webhook/document-uploaded}
      N8N_WEBHOOK_TIMEOUT_SECONDS: ${N8N_WEBHOOK_TIMEOUT_SECONDS:-5}
      DOCUMENT_AUTO_RETRY_MAX: ${DOCUMENT_AUTO_RETRY_MAX:-3}
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr}
      OCR_RASTERIZE_DPI: ${OCR_RASTERIZE_DPI:-200}
      OCR_MAX_RETRIES: ${OCR_MAX_RETRIES:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      CHUNK_TOKEN_LIMIT: ${CHUNK_TOKEN_LIMIT:-500}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}
      SEARCH_KEYWORD_WEIGHT: ${SEARCH_KEYWORD_WEIGHT:-0.4}
      SEARCH_VECTOR_WEIGHT: ${SEARCH_VECTOR_WEIGHT:-0.6}
      SEARCH_DEFAULT_LIMIT: ${SEARCH_DEFAULT_LIMIT:-10}
      CHAT_CONTEXT_CHUNKS: ${CHAT_CONTEXT_CHUNKS:-5}
    volumes:
      - documents:/documents
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery-worker:
    build:
      context: apps/backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-contracts}}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      DOCUMENTS_STORAGE_PATH: ${DOCUMENTS_STORAGE_PATH:-/documents}
      OCR_ENGINE: ${OCR_ENGINE:-paddleocr}
      OCR_RASTERIZE_DPI: ${OCR_RASTERIZE_DPI:-200}
      OCR_MAX_RETRIES: ${OCR_MAX_RETRIES:-3}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai_compatible}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_MAX_RETRIES: ${EMBEDDING_MAX_RETRIES:-3}
      CHUNK_TOKEN_LIMIT: ${CHUNK_TOKEN_LIMIT:-500}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-50}
    volumes:
      - documents:/documents
      # PaddleOcrEngine (app/services/ocr_engine.py) downloads its det/rec/cls
      # models to ~/.paddleocr on first use, lazily, inside the task itself.
      # Without this, every container recreate (e.g. after a crash -- see the
      # task_acks_late comment in app/celery_app.py) throws that cache away
      # and re-downloads ~100-200MB of models from scratch on the very next
      # OCR task, adding real time/network/memory pressure on top of
      # whatever caused the crash in the first place.
      - paddleocr_cache:/root/.paddleocr
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPU_LIMIT:-2}"
          memory: ${WORKER_MEMORY_LIMIT:-4G}
        reservations:
          cpus: "${WORKER_CPU_RESERVATION:-0.5}"
          memory: ${WORKER_MEMORY_RESERVATION:-1G}
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-contracts}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      N8N_DB_NAME: ${N8N_DB_NAME:-n8n}
      N8N_DB_USER: ${N8N_DB_USER:-n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: n8nio/n8n:1.71.3
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "sh /docker-entrypoint-n8n/n8n-bootstrap.sh"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${N8N_DB_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${N8N_DB_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-change-me}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-replace-this-key}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-UTC}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me}
    volumes:
      - n8n_data:/home/node/.n8n
      - documents:/documents
      - ./n8n/workflows:/workflows:ro
      - ./infra/n8n-bootstrap.sh:/docker-entrypoint-n8n/n8n-bootstrap.sh:ro
      - ./infra/n8n-credentials.template.json:/docker-entrypoint-n8n/n8n-credentials.template.json:ro
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5678/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  n8n_data:
  documents:
  paddleocr_cache:
